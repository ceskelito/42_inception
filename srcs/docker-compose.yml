---
name: inception
---
services:
  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx/
    environment:
      HOST_DOMAIN: ${HOST_DOMAIN:-login.42.fr}
    volumes:
      - ./requirements/nginx/templates:/etc/nginx/templates:ro
    secrets:
      - source: tls_cert
        target: /run/secrets/${HOST_DOMAIN:-login.42.fr}.crt
      - source: tls_key
        target: /run/secrets/${HOST_DOMAIN:-login.42.fr}.key
    ports:
      - "4343:443"
    restart: always

secrets:
  tls_cert:
    file: ./requirements/nginx/certs/tls_crt
  tls_key:
    file: ./requirements/nginx/certs/tls_key
