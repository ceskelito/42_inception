---
name: inception
---
services:

  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx/
    environment:
      HOST_DOMAIN: ${HOST_DOMAIN:-login.42.fr}
    networks:
      - inception
    volumes:
      - ./requirements/nginx/templates:/etc/nginx/templates:ro
    secrets:
      - source: tls_cert
        target: /run/secrets/${HOST_DOMAIN:-login.42.fr}.crt
      - source: tls_key
        target: /run/secrets/${HOST_DOMAIN:-login.42.fr}.key
    ports:
      - "4343:443"
    restart: always

  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb/
    env_file: .env
    networks:
      - inception
    volumes:
     - mariadb-data:/usr/data/ # idk where to mount it
    secrets:
      - source: mysql_pass
        target: ${INC_MYSQL_PASS_FILE:-/run/secrets/mysql_pass}

networks:
  inception:

volumes:
  mariadb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INC_DATA}

secrets:
  tls_cert:
    file: ${TLS_CRT:-../secrets/tls_crt}
  tls_key:
    file: ${TLS_KEY:-../secrets/tls_key}
  mysql_pass:
    file: ${MYSQL_PASS_FILE:-../secrets/mysql_pass}
