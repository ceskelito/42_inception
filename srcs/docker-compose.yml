---
name: inception
---
services:

  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx/
    environment:
      HOST_DOMAIN: ${HOST_DOMAIN:-login.42.fr}
    volumes:
      - wp-websites:/var/www/html/wordpress/:ro
    secrets:
      - source: tls_cert
        target: /run/secrets/${HOST_DOMAIN:-login.42.fr}.crt
      - source: tls_key
        target: /run/secrets/${HOST_DOMAIN:-login.42.fr}.key
    ports:
      - "4343:443"
    networks:
      - inception
    depends_on:
      - wordpress
    restart: always

  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb/
    env_file: .env
    volumes:
      - wp-database:/var/lib/mysql
    secrets:
      - source: wp_db_password
        target: ${WP_DB_PASS_FILE:-/run/secrets/wp_db_password}
    networks:
      - inception
    healthcheck:
      test: mariadb -h localhost -u"$$WP_DB_USER" "$$WP_DB_NAME" -p"$$(cat $$WP_DB_PASS_FILE)" -N -B -e "SELECT 1" &>/dev/null
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: always

  wordpress:
    container_name: wordpress
    build:
      context: ./requirements/wordpress/
    env_file: .env
    volumes:
      - wp-websites:/var/www/html/wordpress/
    secrets:
      - source: wp_db_password
        target: ${WP_DB_PASS_FILE:-/run/secrets/wp_db_password}
    networks:
      - inception
    ports:
      - "9000"
    depends_on:
      mariadb:
       condition: service_healthy
       restart: true
    restart: always

networks:
  inception:

volumes:
  wp-database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INC_DATA}/wp-database
  wp-websites:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INC_DATA}/wp-websites

secrets:
  tls_cert:
    file: ${TLS_CRT:-../secrets/tls_crt}
  tls_key:
    file: ${TLS_KEY:-../secrets/tls_key}
  wp_db_password:
    file: '../secrets/wp_db_password'
