
services:
  nginx:
    env_file: ".env"
    container_name: nginx
    build:
      context: requirements/nginx/
      args:
        user: ${USER}
        base_domain: ${BASE_DOMAIN}
        certs_path: ${NGINX_CERTS_PATH}
        ssl_cert: ${NGINX_SSL_CERT}
        ssl_cert_key: ${NGINX_SSL_CERT_KEY}
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    secrets:
      - tls_cert
      - tls_key

    ports:
      - "4343:443"

configs:
  nginx_conf:
    file: ./requirements/nginx/rendered/default.conf

secrets:
  tls_cert:
    file: ./requirements/nginx/certs/${BASE_DOMAIN}.crt
  tls_key:
    file: ./requirements/nginx/certs/${BASE_DOMAIN}.key
